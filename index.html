<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welkit – AI Marketing Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #060611;
  --bg2:     #0b0b1c;
  --bg3:     #101025;
  --border:  #1a1a35;
  --border2: #222245;
  --text:    #e8e4ff;
  --text2:   #7a75a0;
  --text3:   #3a3860;
  --accent:  #5b4fea;
  --accent2: #00d4c8;
  --gold:    #f5c842;
  --red:     #ff6b6b;
  --green:   #00d4c8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}

/* TOPBAR */
.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:30px;height:30px;background:linear-gradient(135deg,#5b4fea,#00d4c8);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;box-shadow:0 0 16px rgba(91,79,234,0.5);}
.logo-text{font-size:15px;font-weight:700;letter-spacing:-0.5px;}
.logo-text span{color:var(--accent);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.badge{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--accent2);background:rgba(0,212,200,0.08);border:1px solid rgba(0,212,200,0.2);padding:3px 10px;border-radius:20px;}
.lang-switch{display:flex;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;padding:2px;gap:2px;}
.lang-btn{padding:3px 10px;border-radius:5px;border:none;font-size:11px;font-weight:500;cursor:pointer;background:transparent;color:var(--text3);font-family:inherit;transition:all 0.15s;}
.lang-btn.on{background:var(--accent);color:#fff;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 52px);}

/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;}
.sidebar-body::-webkit-scrollbar{width:3px;}
.sidebar-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.s-lbl{font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}

/* Chat */
.chat{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.chat::-webkit-scrollbar{width:3px;}
.msg{padding:7px 11px;border-radius:8px;font-size:12px;line-height:1.5;max-width:94%;}
.mb{background:var(--bg3);color:var(--text2);align-self:flex-start;border:1px solid var(--border);}
.mu{background:rgba(91,79,234,0.15);color:#b8b0ff;align-self:flex-end;border:1px solid rgba(91,79,234,0.25);}
.ms{background:rgba(0,212,200,0.06);color:var(--accent2);font-size:10.5px;align-self:center;text-align:center;border:1px solid rgba(0,212,200,0.15);width:100%;max-width:100%;}
.mt{color:var(--text3);font-style:italic;background:var(--bg3);border:1px solid var(--border);animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}

/* Quick prompts */
.quick-list{display:flex;flex-direction:column;gap:4px;}
.qbtn{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:11px;color:var(--text2);cursor:pointer;text-align:left;line-height:1.45;transition:all 0.15s;font-family:inherit;}
.qbtn:hover{border-color:rgba(91,79,234,0.4);color:var(--text);background:var(--bg3);}

/* Settings */
.settings{display:flex;flex-direction:column;gap:10px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field-lbl{font-size:10px;color:var(--text3);}
.field input,.field select{background:var(--bg);border:1px solid var(--border2);border-radius:7px;padding:7px 11px;font-size:12px;color:var(--text);outline:none;font-family:inherit;width:100%;transition:border-color 0.15s;}
.field input:focus,.field select:focus{border-color:rgba(91,79,234,0.5);}
.field input::placeholder{color:var(--text3);}

/* Chips */
.chips{display:flex;gap:5px;flex-wrap:wrap;}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 13px;font-size:11px;color:var(--text3);cursor:pointer;transition:all 0.15s;font-weight:500;font-family:inherit;}
.chip.on{border-color:rgba(91,79,234,0.6);color:#9b91ff;background:rgba(91,79,234,0.1);}
.chip:hover:not(.on){border-color:var(--border2);color:var(--text2);}
.qchips{display:flex;gap:5px;}
.qchip{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 4px;font-size:10.5px;color:var(--text3);cursor:pointer;transition:all 0.15s;font-weight:500;text-align:center;font-family:inherit;}
.qchip .qi{display:block;font-size:13px;margin-bottom:2px;}
.qchip.on{border-color:rgba(245,200,66,0.5);color:var(--gold);background:rgba(245,200,66,0.08);}
.qchip:hover:not(.on){border-color:var(--border2);color:var(--text2);}

/* Rules */
.rules{background:var(--bg);border:1px solid rgba(0,212,200,0.1);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:7px;}
.rule{display:flex;align-items:flex-start;gap:8px;}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.dot-r{background:var(--red);}
.dot-g{background:var(--green);}
.dot-p{background:var(--accent);}
.rule-txt{font-size:11px;color:#4e6e6a;line-height:1.45;}
.r-red{color:var(--red);font-weight:500;}
.r-grn{color:var(--green);font-weight:500;}
.r-prp{color:#9b91ff;font-weight:500;}

/* Input area */
.input-area{padding:10px 14px 12px;border-top:1px solid var(--border);background:var(--bg2);display:flex;gap:7px;}
.main-input{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--text);outline:none;font-family:inherit;resize:none;height:40px;transition:border-color 0.15s;}
.main-input:focus{border-color:rgba(91,79,234,0.5);}
.main-input::placeholder{color:var(--text3);}
.send-btn{width:40px;height:40px;border-radius:8px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;box-shadow:0 2px 12px rgba(91,79,234,0.4);}
.send-btn:hover{background:#6b5ffa;transform:translateY(-1px);}
.send-btn:active{transform:scale(0.95);}
.send-btn:disabled{background:var(--border2);cursor:not-allowed;box-shadow:none;transform:none;}
.send-btn svg{width:15px;height:15px;fill:#fff;}

/* PREVIEW PANE */
.preview{background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
.preview-top{height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);}
.preview-lbl{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
.pactions{display:flex;gap:7px;}
.pbtn{background:var(--bg2);border:1px solid var(--border2);border-radius:7px;padding:5px 14px;font-size:11.5px;color:var(--text2);cursor:pointer;transition:all 0.15s;font-family:inherit;}
.pbtn:hover{color:var(--text);background:var(--bg3);}
.pbtn.prim{background:rgba(91,79,234,0.12);border-color:rgba(91,79,234,0.4);color:#9b91ff;}
.pbtn.prim:hover{background:rgba(91,79,234,0.22);}
.pbtn.gold{background:rgba(245,200,66,0.08);border-color:rgba(245,200,66,0.3);color:var(--gold);}
.pbtn.gold:hover{background:rgba(245,200,66,0.16);}

.preview-body{flex:1;overflow:auto;padding:24px;display:flex;align-items:center;justify-content:center;}
.preview-body::-webkit-scrollbar{width:4px;}
.preview-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* States */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;min-height:340px;width:100%;}
.state-icon{width:56px;height:56px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;}
.state-title{font-size:15px;font-weight:500;color:var(--text3);}
.state-sub{font-size:12px;color:var(--text3);max-width:300px;line-height:1.6;opacity:0.8;}
.tips{display:flex;flex-direction:column;gap:6px;max-width:340px;margin-top:4px;}
.tip{font-size:11px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;text-align:left;opacity:0.8;}
.tip b{color:var(--accent2);font-weight:500;}

.spinner{width:34px;height:34px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.gen-steps{display:flex;flex-direction:column;gap:7px;align-items:center;}
.gstep{font-size:12px;color:var(--text3);transition:color 0.3s;}
.gstep.active{color:var(--accent);}
.gstep.done{color:var(--accent2);}
.gstep.done::before{content:'✓ ';}
.gen-note{font-size:11px;color:var(--text3);opacity:0.6;text-align:center;max-width:200px;line-height:1.5;}

.ready-btns{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center;}
.rbtn{border:none;border-radius:8px;padding:10px 22px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;}
.rbtn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 16px rgba(91,79,234,0.5);}
.rbtn-primary:hover{background:#6b5ffa;transform:translateY(-1px);}
.rbtn-sec{background:var(--bg2);color:var(--text2);border:1px solid var(--border2);}
.rbtn-sec:hover{color:var(--text);border-color:var(--border);}

hr.sep{height:1px;background:var(--border);border:none;margin:2px 0;}
</style>
</head>

// ── BRANDING INJECTION ──────────────────────────────────────────────────────
function injectBranding(html, ibCode) {
  const footer = `<div style="position:fixed;bottom:0;left:0;right:0;background:linear-gradient(90deg,rgba(4,8,25,0.97),rgba(8,18,45,0.97));padding:8px 20px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(91,79,234,0.3);z-index:99999;font-family:-apple-system,sans-serif;backdrop-filter:blur(12px);"><img src="${WELTRADE_LOGO}" alt="Weltrade" style="height:24px;width:auto;"><span style="color:#3a3860;font-size:10px;">weltrade.com</span><span style="color:#5b4fea;font-size:10px;background:rgba(91,79,234,0.12);padding:3px 10px;border-radius:12px;border:1px solid rgba(91,79,234,0.3);">${ibCode}</span></div><div style="height:46px;"></div>`;
  return html.includes('</body>') ? html.replace('</body>', footer + '</body>') : html + footer;
}

// ── PREVIEW: open in new tab (THE ONLY RELIABLE APPROACH) ──────────────────
function openPreview() {
  if (!generatedHTML) return;
  const win = window.open('', '_blank');
  if (!win) {
    alert('Popup blocked!\n\nPlease allow popups for this page in your browser settings, then click "Open Preview" again.');
    return;
  }
  win.document.open();
  win.document.write(generatedHTML);
  win.document.close();
}

// ── DOWNLOAD ────────────────────────────────────────────────────────────────
function dl() {
  if (!generatedHTML) return;
  const ibCode = document.getElementById('ibCode').value || 'IB-WL-0000';
  const blob = new Blob([generatedHTML], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `weltrade_${fmt}_${quality}_${ibCode}_${Date.now()}.html`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

  if (!lastNBPrompt) return;
  window.open(`https://nano-banana2.co/generate/models/nano-banana-2?prompt=${encodeURIComponent(lastNBPrompt)}`, '_blank');

}

      <div class="state-title">${t.emptyTitle}</div>

      </div>
    </div>`;
}

function showGenerating() {
  const t = T[lang];
  document.getElementById('previewBody').innerHTML = `
    <div class="state">
      <div class="spinner"></div>
      <div class="gen-steps">
        <div class="gstep active" id="gs1">${t.gen1}</div>
        <div class="gstep" id="gs2">${t.gen2}</div>
        <div class="gstep" id="gs3">${t.gen3}</div>
      </div>
      <div class="gen-note">${t.qualNote(quality)}</div>
    </div>`;
  let s = 1;
  const iv = setInterval(() => {
    if (s >= 3) return clearInterval(iv);
    const prev = document.getElementById(`gs${s}`);
    if (prev) { prev.classList.remove('active'); prev.classList.add('done'); }
    s++;
    const cur = document.getElementById(`gs${s}`);
    if (cur) cur.classList.add('active');
  }, 1300);
}

function showReady() {

  document.getElementById('previewBody').innerHTML = `

}

// ── CHAT ─────────────────────────────────────────────────────────────────────
function addMsg(txt, cls) {
  const box = document.getElementById('chatBox');
  const d = document.createElement('div');
  d.className = `msg ${cls}`;
  if (cls === 'mt') d.id = 'thinkMsg';
  d.textContent = txt;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function removeThinking() {
  const el = document.getElementById('thinkMsg');
  if (el) el.remove();
}

// ── SEND ─────────────────────────────────────────────────────────────────────
async function send() {
  const input = document.getElementById('msgInput');
  const btn   = document.getElementById('sendBtn');
  const text  = input.value.trim();
  if (!text) return;

  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { addMsg(T[lang].noKey, 'mb'); return; }

  lastPrompt   = text;
  lastNBPrompt = buildNBPrompt(text);
  input.value  = '';
  btn.disabled = true;

  addMsg(text, 'mu');
  addMsg(T[lang].thinking, 'mt');
  showGenerating();

  const ibCode  = document.getElementById('ibCode').value || 'IB-WL-0000';
  const matLang = document.getElementById('matLang').value;
  const maxTok  = quality === 'ultra' ? 7000 : quality === 'premium' ? 5000 : 3500;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: maxTok,
        system: getSystemPrompt(ibCode, matLang),
        messages: [{role:'user', content:`Create a ${fmt} for: ${text}`}]
      })
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      removeThinking();
      addMsg('❌ API Error: ' + (data.error?.message || `${res.status} ${res.statusText}`), 'mb');
      showEmpty();
      btn.disabled = false;
      return;
    }

    let html = data.content?.[0]?.text || '';
    removeThinking();

    if (html) {
      // Strip markdown fences if model added them
      html = html.replace(/^[\s\S]*?```(?:html)?\s*\n/i, '').replace(/\n?```[\s\S]*$/, '').trim();
      html = injectBranding(html, ibCode);
      generatedHTML = html;
      addMsg(T[lang].done, 'mb');
      showReady();
      document.getElementById('previewLbl').textContent = `— ${fmt} • ${quality}`;
      document.getElementById('pActions').style.display = 'flex';
    } else {
      addMsg(T[lang].error, 'mb');
      showEmpty();
    }
  } catch(e) {
    removeThinking();
    addMsg('❌ ' + (e.message.includes('fetch') ? 'Network error. Check your connection.' : e.message), 'mb');
    showEmpty();
  }

  btn.disabled = false;
}

function regen() { if (lastPrompt) { document.getElementById('msgInput').value = lastPrompt; send(); } }
function handleKey(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } }

// ── CONTROLS ─────────────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('on', b.textContent.includes(l.toUpperCase())));
  applyLang();
}
function setFmt(el, f) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  fmt = f;
}
function setQuality(el, q) {
  document.querySelectorAll('.qchip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  quality = q;
}

// ── APPLY LANG ───────────────────────────────────────────────────────────────
function applyLang() {
  const t = T[lang];
  const set = (id, val, html=false) => { const el = document.getElementById(id); if(el) html ? el.innerHTML=val : el.textContent=val; };
  set('badgeText', t.badge);
  set('sysMsg', t.sysMsg);
  set('welcomeMsg', t.welcome);
  document.getElementById('msgInput').placeholder = t.placeholder;
  set('lbl-chat', t.lChat); set('lbl-quick', t.lQuick); set('lbl-settings', t.lSettings);
  set('lbl-api', t.lApi); set('lbl-ib', t.lIb); set('lbl-lang', t.lLang);
  set('lbl-fmt', t.lFmt); set('lbl-qual', t.lQual); set('lbl-rules', t.lRules);
  set('rule1', t.r1, true); set('rule2', t.r2, true); set('rule3', t.r3, true); set('rule4', t.r4, true);
  set('btnRegen', t.btnRegen); set('btnOpen', t.btnOpen); set('btnDl', t.btnDl);

  const ql = document.getElementById('quickList');
  ql.innerHTML = '';
  QUICK[lang].forEach(q => {
    const b = document.createElement('button');
    b.className = 'qbtn';
    b.innerHTML = `<span style="margin-right:5px;">${q.icon}</span>${q.text}`;
    b.onclick = () => { document.getElementById('msgInput').value = q.text; send(); };
    ql.appendChild(b);
  });

  if (!generatedHTML) showEmpty();
}

document.addEventListener('DOMContentLoaded', applyLang);
